<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life in Weeks - Lifespan Calendar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000000;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .date-range {
            font-size: 16px;
            color: #444444;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #ddd;
            background-color: #ffffff;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            color: #333;
        }

        .toggle-btn:hover {
            border-color: #999;
            transform: scale(1.05);
        }

        .toggle-btn.active {
            border-color: #78beff;
        }

        .grid-wrapper {
            position: relative;
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .age-labels {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 30px;
            width: 40px;
            flex-shrink: 0;
        }

        .age-label {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            font-size: 11px;
            color: #333333;
            font-weight: 500;
        }

        .grid-container {
            flex: 1;
        }

        .week-numbers {
            display: flex;
            gap: 1px;
            margin-bottom: 15px;
            padding-left: 0;
            justify-content: flex-start;
        }

        .week-number-label {
            font-size: 10px;
            color: #666666;
            font-weight: 500;
            width: 11.66px;
            text-align: center;
            flex: 1;
        }

        .week-number-label.major {
            color: #333333;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background-color: #e8e8e8;
            padding: 1px;
            border: 1px solid #d0d0d0;
        }

        .year-row {
            display: flex;
            gap: 1px;
            height: 10px;
        }

        .week {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
        }

        .week:hover {
            filter: brightness(0.95);
        }

        .week.lived {
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }

        .week.lived:hover {
            background-color: #333333;
            border-color: #333333;
        }

        .week.current {
            background-color: #78beff;
            border-color: #78beff;
            box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 1px #78beff;
        }

        .week.current:hover {
            background-color: #78beff;
            border-color: #78beff;
        }

        .week.remaining {
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 35px;
            font-size: 12px;
            color: #333333;
            font-weight: 500;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-square {
            width: 14px;
            height: 14px;
            border: 1px solid #d8d8d8;
        }

        .legend-square.lived {
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }

        .legend-square.current {
            background-color: #78beff;
            border-color: #78beff;
            position: relative;
        }

        .legend-square.current::after {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1px solid #ffffff;
        }

        .legend-square.remaining {
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
        }

        .legend-text {
            letter-spacing: 0.3px;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #888888;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .reflections {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 2px solid #e0e0e0;
        }

        .reflections-title {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .reflections-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 20px;
        }

        .reflection-item {
            padding: 16px;
            background-color: #f9f9f9;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }

        .reflection-text {
            font-size: 13px;
            line-height: 1.6;
            color: #333333;
        }

        .reflection-number {
            font-weight: 700;
            color: #1a1a1a;
        }

        @media (max-width: 1024px) {
            .reflections {
                margin-top: 50px;
                padding-top: 30px;
            }
            .reflections-title {
                font-size: 16px;
            }
            .reflections-grid {
                gap: 18px;
            }
            .reflection-item {
                padding: 14px;
            }
            .reflection-text {
                font-size: 12px;
            }
        }

        @media (max-width: 768px) {
            .reflections {
                margin-top: 40px;
                padding-top: 24px;
            }
            .reflections-title {
                font-size: 14px;
                margin-bottom: 20px;
            }
            .reflections-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .reflection-item {
                padding: 12px;
            }
            .reflection-text {
                font-size: 11px;
                line-height: 1.5;
            }
        }

        @media (max-width: 480px) {
            .reflections {
                margin-top: 32px;
                padding-top: 18px;
            }
            .reflections-title {
                font-size: 12px;
                margin-bottom: 16px;
            }
            .reflections-grid {
                gap: 10px;
            }
            .reflection-item {
                padding: 10px;
            }
            .reflection-text {
                font-size: 10px;
                line-height: 1.4;
            }
        }

        @media print {
            body {
                padding: 20px;
            }
            .container {
                max-width: 100%;
            }
            .week:hover {
                filter: none;
            }
        }

        @media (max-width: 1024px) {
            body {
                padding: 30px 20px;
            }
            .controls {
                top: 15px;
                right: 15px;
                gap: 10px;
            }
            .toggle-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .title {
                font-size: 32px;
            }
            .grid-wrapper {
                gap: 12px;
            }
            .year-row {
                height: 9px;
            }
            .age-label {
                font-size: 10px;
                height: 45px;
                padding-right: 8px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }
            .controls {
                top: 12px;
                right: 12px;
                gap: 8px;
            }
            .toggle-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
                border-width: 1.5px;
            }
            .container {
                max-width: 100%;
            }
            .header {
                margin-bottom: 24px;
            }
            .title {
                font-size: 24px;
                letter-spacing: 1px;
                margin-bottom: 6px;
            }
            .date-range {
                font-size: 13px;
            }
            .subtitle {
                font-size: 12px;
            }
            .grid-wrapper {
                gap: 8px;
                margin-top: 24px;
            }
            .age-labels {
                width: 32px;
                padding-top: 20px;
            }
            .age-label {
                font-size: 8px;
                height: 41px;
                padding-right: 4px;
            }
            .week-numbers {
                margin-bottom: 10px;
            }
            .week-number-label {
                font-size: 8px;
                width: 11px;
            }
            .year-row {
                height: 7px;
                gap: 0.5px;
            }
            .grid {
                gap: 0.5px;
                padding: 0.5px;
            }
            .legend {
                gap: 24px;
                margin-top: 24px;
                font-size: 11px;
            }
            .legend-square {
                width: 12px;
                height: 12px;
            }
            .footer-text {
                font-size: 10px;
                margin-top: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
                min-height: auto;
            }
            .controls {
                top: 10px;
                right: 10px;
                gap: 6px;
            }
            .toggle-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
                border-width: 1.5px;
            }
            .header {
                margin-bottom: 18px;
            }
            .title {
                font-size: 18px;
                letter-spacing: 0.5px;
                margin-bottom: 4px;
            }
            .date-range {
                font-size: 11px;
                margin-bottom: 3px;
            }
            .subtitle {
                font-size: 10px;
            }
            .grid-wrapper {
                gap: 6px;
                margin-top: 18px;
                flex-direction: column;
            }
            .age-labels {
                width: 100%;
                flex-direction: row;
                padding-top: 0;
                padding-bottom: 8px;
                justify-content: flex-start;
                overflow-x: auto;
                gap: 0;
            }
            .age-label {
                font-size: 7px;
                height: auto;
                padding: 2px 3px;
                min-width: 20px;
                text-align: center;
                padding-right: 3px;
                flex-shrink: 0;
            }
            .grid-container {
                overflow-x: auto;
                padding-bottom: 8px;
            }
            .week-numbers {
                margin-bottom: 8px;
                display: none;
            }
            .week-number-label {
                font-size: 7px;
            }
            .year-row {
                height: 6px;
                gap: 0;
            }
            .grid {
                gap: 0;
                padding: 0;
            }
            .week {
                border: none;
            }
            .week {
                border: 0.5px solid #e0e0e0;
            }
            .legend {
                flex-wrap: wrap;
                gap: 16px;
                margin-top: 18px;
                font-size: 9px;
                justify-content: center;
            }
            .legend-square {
                width: 10px;
                height: 10px;
            }
            .footer-text {
                font-size: 9px;
                margin-top: 16px;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="toggle-btn" id="langToggle" title="Toggle Language" aria-label="Toggle Language">🌐</button>
    </div>

    <div class="container">
        <div class="header">
            <div class="title">MY LIFE IN WEEKS - KAIO GARCIA</div>
            <div class="date-range">September 3, 1993 → September 3, 2063</div>
            <div class="subtitle">70 years • 3,640 weeks</div>
        </div>

        <div class="grid-wrapper">
            <div class="age-labels" id="ageLabels"></div>
            <div class="grid-container">
                <div class="week-numbers" id="weekNumbers"></div>
                <div class="grid" id="grid"></div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-square lived"></div>
                <span class="legend-text">LIVED</span>
            </div>
            <div class="legend-item">
                <div class="legend-square current"></div>
                <span class="legend-text">CURRENT WEEK</span>
            </div>
            <div class="legend-item">
                <div class="legend-square remaining"></div>
                <span class="legend-text">REMAINING</span>
            </div>
        </div>

        <div class="footer-text">Time is finite. Every square is a real piece of your life.</div>

        <div class="reflections">
            <div class="reflections-title">Consider This</div>
            <div class="reflections-grid" id="reflectionsGrid"></div>
        </div>
    </div>

    <script>
        const BIRTH_DATE = new Date('1993-09-03');
        const CURRENT_DATE = new Date('2026-09-10');
        const LIFESPAN_YEARS = 70;
        const WEEKS_PER_YEAR = 52;
        const TOTAL_WEEKS = LIFESPAN_YEARS * WEEKS_PER_YEAR;

        // Calculate the total weeks lived
        const timeDiff = CURRENT_DATE - BIRTH_DATE;
        const weeksPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24 * 7));
        const currentWeekIndex = weeksPassed; // 0-indexed

        console.log(`Weeks passed: ${weeksPassed}`);
        console.log(`Current week index (0-based): ${currentWeekIndex}`);
        console.log(`Total weeks: ${TOTAL_WEEKS}`);

        // Generate age labels
        const ageLabelsContainer = document.getElementById('ageLabels');
        for (let i = 0; i < LIFESPAN_YEARS; i += 5) {
            const label = document.createElement('div');
            label.className = 'age-label';
            label.textContent = i;
            ageLabelsContainer.appendChild(label);
        }
        // Add the final age label
        const finalLabel = document.createElement('div');
        finalLabel.className = 'age-label';
        finalLabel.textContent = LIFESPAN_YEARS;
        ageLabelsContainer.appendChild(finalLabel);

        // Generate week number labels
        const weekNumbersContainer = document.getElementById('weekNumbers');
        const weekLabelsToShow = [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50];
        for (let i = 0; i < WEEKS_PER_YEAR; i++) {
            const label = document.createElement('div');
            label.className = 'week-number-label';
            if (weekLabelsToShow.includes(i + 1)) {
                label.textContent = i + 1;
                label.classList.add('major');
            }
            weekNumbersContainer.appendChild(label);
        }

        // Generate the grid
        const grid = document.getElementById('grid');
        for (let year = 0; year < LIFESPAN_YEARS; year++) {
            const yearRow = document.createElement('div');
            yearRow.className = 'year-row';

            for (let week = 0; week < WEEKS_PER_YEAR; week++) {
                const weekIndex = year * WEEKS_PER_YEAR + week;
                const weekElement = document.createElement('div');
                weekElement.className = 'week';

                if (weekIndex < currentWeekIndex) {
                    weekElement.classList.add('lived');
                } else if (weekIndex === currentWeekIndex) {
                    weekElement.classList.add('current');
                    weekElement.title = `Current Week (Age ${year}, Week ${week + 1})`;
                } else {
                    weekElement.classList.add('remaining');
                }

                weekElement.addEventListener('mouseenter', function() {
                    const age = Math.floor(weekIndex / WEEKS_PER_YEAR);
                    const weekOfYear = (weekIndex % WEEKS_PER_YEAR) + 1;
                    this.title = `Age ${age}, Week ${weekOfYear}`;
                });

                yearRow.appendChild(weekElement);
            }

            grid.appendChild(yearRow);
        }

        // Calculate reflections
        const yearsRemaining = LIFESPAN_YEARS - Math.floor(currentWeekIndex / WEEKS_PER_YEAR);
        const weeksRemaining = TOTAL_WEEKS - currentWeekIndex;
        const daysRemaining = weeksRemaining * 7;
        const morningsRemaining = daysRemaining;

        const reflections = [
            {
                text: "You have approximately <span class='reflection-number'>" + yearsRemaining + "</span> more birthdays."
            },
            {
                text: "You have approximately <span class='reflection-number'>" + yearsRemaining + "</span> more summers."
            },
            {
                text: "You have approximately <span class='reflection-number'>" + yearsRemaining + "</span> more years to watch those you love grow."
            },
            {
                text: "You have approximately <span class='reflection-number'>" + yearsRemaining + "</span> more Christmases with the people you love."
            },
            {
                text: "If you travel once every 3 years, you have approximately <span class='reflection-number'>" + Math.floor(yearsRemaining / 3) + "</span> more trips."
            },
            {
                text: "If you see someone you love once a week, you have approximately <span class='reflection-number'>" + weeksRemaining + "</span> more times to see them."
            },
            {
                text: "If you read one book a month, you have approximately <span class='reflection-number'>" + Math.floor(yearsRemaining * 12) + "</span> more books to read."
            },
            {
                text: "If you take one vacation every year, you have approximately <span class='reflection-number'>" + yearsRemaining + "</span> more vacations."
            },
            {
                text: "You have approximately <span class='reflection-number'>" + yearsRemaining + "</span> more New Year's Eves."
            },
            {
                text: "You have approximately <span class='reflection-number'>" + Math.floor(yearsRemaining * 52) + "</span> more weekends."
            },
            {
                text: "You have approximately <span class='reflection-number'>" + morningsRemaining + "</span> more mornings."
            },
            {
                text: "You have approximately <span class='reflection-number'>" + Math.floor(weeksRemaining / 4) + "</span> more chances to start something you've been postponing."
            }
        ];

        // Populate reflections grid
        const reflectionsGrid = document.getElementById('reflectionsGrid');
        reflections.forEach(reflection => {
            const item = document.createElement('div');
            item.className = 'reflection-item';
            item.innerHTML = '<div class="reflection-text">' + reflection.text + '</div>';
            reflectionsGrid.appendChild(item);
        });

        // ===== LANGUAGE & DARK MODE TOGGLE =====
        const translations = {
            en: {
                pageTitle: "MY LIFE IN WEEKS - KAIO GARCIA",
                dateRange: "September 3, 1993 → September 3, 2063",
                subtitle: "70 years • 3,640 weeks",
                lived: "LIVED",
                currentWeek: "CURRENT WEEK",
                remaining: "REMAINING",
                footerText: "Time is finite. Every square is a real piece of your life.",
                considerThis: "Consider This",
                birthdays: "You have approximately {X} more birthdays.",
                summers: "You have approximately {X} more summers.",
                watchGrow: "You have approximately {X} more years to watch those you love grow.",
                christmases: "You have approximately {X} more Christmases with the people you love.",
                trips: "If you travel once every 3 years, you have approximately {X} more trips.",
                seeLoved: "If you see someone you love once a week, you have approximately {X} more times to see them.",
                books: "If you read one book a month, you have approximately {X} more books to read.",
                vacations: "If you take one vacation every year, you have approximately {X} more vacations.",
                newYears: "You have approximately {X} more New Year's Eves.",
                weekends: "You have approximately {X} more weekends.",
                mornings: "You have approximately {X} more mornings.",
                chances: "You have approximately {X} more chances to start something you've been postponing."
            },
            pt: {
                pageTitle: "MINHA VIDA EM SEMANAS - KAIO GARCIA",
                dateRange: "3 de Setembro de 1993 → 3 de Setembro de 2063",
                subtitle: "70 anos • 3.640 semanas",
                lived: "VIVIDAS",
                currentWeek: "SEMANA ATUAL",
                remaining: "RESTANTES",
                footerText: "O tempo é finito. Cada quadrado é uma verdadeira parte da sua vida.",
                considerThis: "Considere Isto",
                birthdays: "Você tem aproximadamente {X} aniversários a mais.",
                summers: "Você tem aproximadamente {X} verões a mais.",
                watchGrow: "Você tem aproximadamente {X} anos a mais para ver quem você ama crescer.",
                christmases: "Você tem aproximadamente {X} Natais a mais com as pessoas que ama.",
                trips: "Se você viaja uma vez a cada 3 anos, você tem aproximadamente {X} viagens a mais.",
                seeLoved: "Se você vê alguém que ama uma vez por semana, você tem aproximadamente {X} vezes a mais para vê-los.",
                books: "Se você lê um livro por mês, você tem aproximadamente {X} livros a mais para ler.",
                vacations: "Se você tira uma férias a cada ano, você tem aproximadamente {X} férias a mais.",
                newYears: "Você tem aproximadamente {X} reveillons a mais.",
                weekends: "Você tem aproximadamente {X} fins de semana a mais.",
                mornings: "Você tem aproximadamente {X} manhãs a mais.",
                chances: "Você tem aproximadamente {X} chances a mais de começar algo que você vem adiando."
            }
        };

        let currentLanguage = localStorage.getItem('language') || 'en';

        // Apply language on page load
        applyLanguage(currentLanguage);

        function applyLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            const t = translations[lang];

            document.querySelector('.title').textContent = t.pageTitle;
            document.querySelector('.date-range').textContent = t.dateRange;
            document.querySelector('.subtitle').textContent = t.subtitle;
            document.querySelector('.footer-text').textContent = t.footerText;
            document.querySelector('.reflections-title').textContent = t.considerThis;

            const legendItems = document.querySelectorAll('.legend-item');
            legendItems[0].querySelector('.legend-text').textContent = t.lived;
            legendItems[1].querySelector('.legend-text').textContent = t.currentWeek;
            legendItems[2].querySelector('.legend-text').textContent = t.remaining;

            updateReflections(lang, t);
            updateLangToggleButton();
        }

        function updateReflections(lang, t) {
            const yearsRemaining = LIFESPAN_YEARS - Math.floor(currentWeekIndex / WEEKS_PER_YEAR);
            const weeksRemaining = TOTAL_WEEKS - currentWeekIndex;
            const daysRemaining = weeksRemaining * 7;

            const reflectionsData = [
                t.birthdays.replace('{X}', yearsRemaining),
                t.summers.replace('{X}', yearsRemaining),
                t.watchGrow.replace('{X}', yearsRemaining),
                t.christmases.replace('{X}', yearsRemaining),
                t.trips.replace('{X}', Math.floor(yearsRemaining / 3)),
                t.seeLoved.replace('{X}', weeksRemaining),
                t.books.replace('{X}', Math.floor(yearsRemaining * 12)),
                t.vacations.replace('{X}', yearsRemaining),
                t.newYears.replace('{X}', yearsRemaining),
                t.weekends.replace('{X}', Math.floor(yearsRemaining * 52)),
                t.mornings.replace('{X}', daysRemaining),
                t.chances.replace('{X}', Math.floor(weeksRemaining / 4))
            ];

            const reflectionsGrid = document.getElementById('reflectionsGrid');
            reflectionsGrid.innerHTML = '';
            reflectionsData.forEach(text => {
                const item = document.createElement('div');
                item.className = 'reflection-item';
                item.innerHTML = '<div class="reflection-text">' + text + '</div>';
                reflectionsGrid.appendChild(item);
            });
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'pt' : 'en';
            applyLanguage(currentLanguage);
        }

        function updateLangToggleButton() {
            const btn = document.getElementById('langToggle');
            btn.textContent = currentLanguage === 'en' ? '🇧🇷' : '🇺🇸';
        }

        // Event listeners
        document.getElementById('langToggle').addEventListener('click', toggleLanguage);
    </script>
</body>
</html>
