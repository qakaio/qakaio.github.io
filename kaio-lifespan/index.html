<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life in Weeks - Lifespan Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000000;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .date-range {
            font-size: 16px;
            color: #444444;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .grid-wrapper {
            position: relative;
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .age-labels {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 30px;
            width: 40px;
            flex-shrink: 0;
        }

        .age-label {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            font-size: 11px;
            color: #333333;
            font-weight: 500;
        }

        .grid-container {
            flex: 1;
        }

        .week-numbers {
            display: flex;
            gap: 1px;
            margin-bottom: 15px;
            padding-left: 0;
            justify-content: flex-start;
        }

        .week-number-label {
            font-size: 10px;
            color: #666666;
            font-weight: 500;
            width: 11.66px;
            text-align: center;
            flex: 1;
        }

        .week-number-label.major {
            color: #333333;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background-color: #e8e8e8;
            padding: 1px;
            border: 1px solid #d0d0d0;
        }

        .year-row {
            display: flex;
            gap: 1px;
            height: 10px;
        }

        .week {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
        }

        .week:hover {
            filter: brightness(0.95);
        }

        .week.lived {
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }

        .week.lived:hover {
            background-color: #333333;
            border-color: #333333;
        }

        .week.current {
            background-color: #78beff;
            border-color: #78beff;
            box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 1px #78beff;
        }

        .week.current:hover {
            background-color: #78beff;
            border-color: #78beff;
        }

        .week.remaining {
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 35px;
            font-size: 12px;
            color: #333333;
            font-weight: 500;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-square {
            width: 14px;
            height: 14px;
            border: 1px solid #d8d8d8;
        }

        .legend-square.lived {
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }

        .legend-square.current {
            background-color: #78beff;
            border-color: #78beff;
            position: relative;
        }

        .legend-square.current::after {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1px solid #ffffff;
        }

        .legend-square.remaining {
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
        }

        .legend-text {
            letter-spacing: 0.3px;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #888888;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        @media print {
            body {
                padding: 20px;
            }
            .container {
                max-width: 100%;
            }
            .week:hover {
                filter: none;
            }
        }

        @media (max-width: 1024px) {
            body {
                padding: 30px 20px;
            }
            .title {
                font-size: 32px;
            }
            .grid-wrapper {
                gap: 12px;
            }
            .year-row {
                height: 9px;
            }
            .age-label {
                font-size: 10px;
                height: 45px;
                padding-right: 8px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }
            .container {
                max-width: 100%;
            }
            .header {
                margin-bottom: 24px;
            }
            .title {
                font-size: 24px;
                letter-spacing: 1px;
                margin-bottom: 6px;
            }
            .date-range {
                font-size: 13px;
            }
            .subtitle {
                font-size: 12px;
            }
            .grid-wrapper {
                gap: 8px;
                margin-top: 24px;
            }
            .age-labels {
                width: 32px;
                padding-top: 20px;
            }
            .age-label {
                font-size: 8px;
                height: 41px;
                padding-right: 4px;
            }
            .week-numbers {
                margin-bottom: 10px;
            }
            .week-number-label {
                font-size: 8px;
                width: 11px;
            }
            .year-row {
                height: 7px;
                gap: 0.5px;
            }
            .grid {
                gap: 0.5px;
                padding: 0.5px;
            }
            .legend {
                gap: 24px;
                margin-top: 24px;
                font-size: 11px;
            }
            .legend-square {
                width: 12px;
                height: 12px;
            }
            .footer-text {
                font-size: 10px;
                margin-top: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
                min-height: auto;
            }
            .header {
                margin-bottom: 18px;
            }
            .title {
                font-size: 18px;
                letter-spacing: 0.5px;
                margin-bottom: 4px;
            }
            .date-range {
                font-size: 11px;
                margin-bottom: 3px;
            }
            .subtitle {
                font-size: 10px;
            }
            .grid-wrapper {
                gap: 6px;
                margin-top: 18px;
                flex-direction: column;
            }
            .age-labels {
                width: 100%;
                flex-direction: row;
                padding-top: 0;
                padding-bottom: 8px;
                justify-content: flex-start;
                overflow-x: auto;
                gap: 0;
            }
            .age-label {
                font-size: 7px;
                height: auto;
                padding: 2px 3px;
                min-width: 20px;
                text-align: center;
                padding-right: 3px;
                flex-shrink: 0;
            }
            .grid-container {
                overflow-x: auto;
                padding-bottom: 8px;
            }
            .week-numbers {
                margin-bottom: 8px;
                display: none;
            }
            .week-number-label {
                font-size: 7px;
            }
            .year-row {
                height: 6px;
                gap: 0;
            }
            .grid {
                gap: 0;
                padding: 0;
            }
            .week {
                border: none;
            }
            .week {
                border: 0.5px solid #e0e0e0;
            }
            .legend {
                flex-wrap: wrap;
                gap: 16px;
                margin-top: 18px;
                font-size: 9px;
                justify-content: center;
            }
            .legend-square {
                width: 10px;
                height: 10px;
            }
            .footer-text {
                font-size: 9px;
                margin-top: 16px;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">MY LIFE IN WEEKS - KAIO GARCIA</div>
            <div class="date-range">September 3, 1993 → September 3, 2063</div>
            <div class="subtitle">70 years • 3,640 weeks</div>
        </div>

        <div class="grid-wrapper">
            <div class="age-labels" id="ageLabels"></div>
            <div class="grid-container">
                <div class="week-numbers" id="weekNumbers"></div>
                <div class="grid" id="grid"></div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-square lived"></div>
                <span class="legend-text">LIVED</span>
            </div>
            <div class="legend-item">
                <div class="legend-square current"></div>
                <span class="legend-text">CURRENT WEEK</span>
            </div>
            <div class="legend-item">
                <div class="legend-square remaining"></div>
                <span class="legend-text">REMAINING</span>
            </div>
        </div>

        <div class="footer-text">Time is finite. Every square is a real piece of your life.</div>
    </div>

    <script>
        const BIRTH_DATE = new Date('1993-09-03');
        const CURRENT_DATE = new Date('2026-09-10');
        const LIFESPAN_YEARS = 70;
        const WEEKS_PER_YEAR = 52;
        const TOTAL_WEEKS = LIFESPAN_YEARS * WEEKS_PER_YEAR;

        // Calculate the total weeks lived
        const timeDiff = CURRENT_DATE - BIRTH_DATE;
        const weeksPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24 * 7));
        const currentWeekIndex = weeksPassed; // 0-indexed

        console.log(`Weeks passed: ${weeksPassed}`);
        console.log(`Current week index (0-based): ${currentWeekIndex}`);
        console.log(`Total weeks: ${TOTAL_WEEKS}`);

        // Generate age labels
        const ageLabelsContainer = document.getElementById('ageLabels');
        for (let i = 0; i < LIFESPAN_YEARS; i += 5) {
            const label = document.createElement('div');
            label.className = 'age-label';
            label.textContent = i;
            ageLabelsContainer.appendChild(label);
        }
        // Add the final age label
        const finalLabel = document.createElement('div');
        finalLabel.className = 'age-label';
        finalLabel.textContent = LIFESPAN_YEARS;
        ageLabelsContainer.appendChild(finalLabel);

        // Generate week number labels
        const weekNumbersContainer = document.getElementById('weekNumbers');
        const weekLabelsToShow = [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50];
        for (let i = 0; i < WEEKS_PER_YEAR; i++) {
            const label = document.createElement('div');
            label.className = 'week-number-label';
            if (weekLabelsToShow.includes(i + 1)) {
                label.textContent = i + 1;
                label.classList.add('major');
            }
            weekNumbersContainer.appendChild(label);
        }

        // Generate the grid
        const grid = document.getElementById('grid');
        for (let year = 0; year < LIFESPAN_YEARS; year++) {
            const yearRow = document.createElement('div');
            yearRow.className = 'year-row';

            for (let week = 0; week < WEEKS_PER_YEAR; week++) {
                const weekIndex = year * WEEKS_PER_YEAR + week;
                const weekElement = document.createElement('div');
                weekElement.className = 'week';

                if (weekIndex < currentWeekIndex) {
                    weekElement.classList.add('lived');
                } else if (weekIndex === currentWeekIndex) {
                    weekElement.classList.add('current');
                    weekElement.title = `Current Week (Age ${year}, Week ${week + 1})`;
                } else {
                    weekElement.classList.add('remaining');
                }

                weekElement.addEventListener('mouseenter', function() {
                    const age = Math.floor(weekIndex / WEEKS_PER_YEAR);
                    const weekOfYear = (weekIndex % WEEKS_PER_YEAR) + 1;
                    this.title = `Age ${age}, Week ${weekOfYear}`;
                });

                yearRow.appendChild(weekElement);
            }

            grid.appendChild(yearRow);
        }
    </script>
</body>
</html>
